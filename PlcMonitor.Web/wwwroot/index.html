<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC Monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { min-height: 100vh; overflow-x: hidden; }

  header { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid var(--border); background:var(--bg2); }
  .logo { font-family:var(--sans); font-weight:800; font-size:18px; color:#fff; }
  .logo span { color: var(--accent); }
  .header-status { font-size:11px; color:var(--text2); display:flex; align-items:center; gap:8px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }

  main { display:flex; flex-direction:column; align-items:center; padding:60px 32px; gap:48px; }

  .hero { text-align:center; max-width:480px; }
  .hero h1 { font-family:var(--sans); font-size:38px; font-weight:800; color:#fff; line-height:1.1; letter-spacing:-1px; margin-bottom:12px; }
  .hero h1 span { color: var(--accent); }
  .hero p { font-size:13px; color:var(--text2); line-height:1.7; }

  .actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn { padding:11px 20px; font-size:13px; }

  .divider { width:100%; max-width:720px; display:flex; align-items:center; gap:16px; color:var(--text3); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }

  .projects-section { width:100%; max-width:720px; }
  .projects-list { display:flex; flex-direction:column; gap:8px; }

  .project-card { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; cursor:pointer; transition:all 0.15s ease; gap:16px; }
  .project-card:hover { border-color:var(--accent); background:var(--bg3); }
  .project-card-left { display:flex; align-items:center; gap:14px; min-width:0; }
  .project-icon { width:36px; height:36px; background:var(--bg3); border:1px solid var(--border2); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .project-info { min-width:0; }
  .project-name { font-family:var(--sans); font-size:14px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .project-meta { font-size:11px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .project-card-right { display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .badge { font-size:10px; padding:3px 8px; border-radius:4px; font-weight:500; background:var(--bg3); border:1px solid var(--border2); color:var(--text2); }
  .project-arrow { color:var(--text3); font-size:16px; }
  .project-card:hover .project-arrow { color: var(--accent); }

  .empty-state { text-align:center; padding:40px; color:var(--text3); font-size:13px; border:1px dashed var(--border); border-radius:10px; }
  .empty-state-icon { font-size:32px; margin-bottom:12px; }

  .dialog { width:480px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; }
  .field input { width:100%; padding:10px 12px; background:var(--bg3); border:1px solid var(--border2); border-radius:7px; color:var(--text); font-family:var(--mono); font-size:13px; outline:none; transition:border-color 0.15s; }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--text3); }
  .field-row-browse { display:flex; gap:6px; align-items:flex-end; }
  .field-row-browse .field { flex:1; margin-bottom:0; }
  .path-preview { margin-top:5px; font-size:11px; color:var(--text3); }
  .icon { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>

<header>
  <div class="logo">PLC<span>Monitor</span></div>
  <div class="header-status">
    <div class="dot"></div>
    <span>Сервер активен</span>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Мониторинг<br><span>ПЛК</span> данных</h1>
    <p>Создайте проект мониторинга, добавьте ПЛК,<br>выберите теги — и наблюдайте за данными в реальном времени.</p>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="openNewProjectDialog()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Новый проект
    </button>
    <button class="btn btn-secondary" onclick="openProjectFile()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M5 19a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2 2h4a2 2 0 0 1 2 2v1"/><path d="M5 19h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v5"/></svg>
      Открыть проект
    </button>
  </div>

  <div class="divider">Последние проекты</div>

  <div class="projects-section">
    <div class="projects-list" id="recent-projects">
      <div class="empty-state">
        <div class="empty-state-icon">📂</div>
        <div>Нет последних проектов</div>
        <div style="margin-top:4px;font-size:11px">Создайте новый или откройте существующий</div>
      </div>
    </div>
  </div>
</main>

<!-- Диалог — Новый проект -->
<div class="overlay" id="new-project-overlay">
  <div class="dialog">
    <h3>Новый проект</h3>
    <div class="field">
      <label>Название проекта</label>
      <input type="text" id="new-project-name" placeholder="Например: Линия сборки №1">
    </div>
    <div class="field">
      <label>Папка для сохранения</label>
      <div class="field-row-browse">
        <div class="field">
          <input type="text" id="new-project-path" placeholder="C:\Users\...\Documents\PlcMonitor\">
        </div>
        <button class="btn btn-ghost" onclick="browseSaveFolder()" style="padding:10px 12px;flex-shrink:0;">📁</button>
      </div>
      <div class="path-preview">Файл: <span id="path-preview">...</span></div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" onclick="closeNewProjectDialog()">Отмена</button>
      <button class="btn btn-primary" onclick="createNewProject()">Создать</button>
    </div>
  </div>
</div>

<!-- Диалог — Открыть проект -->
<div class="overlay" id="open-project-overlay">
  <div class="dialog">
    <h3>Открыть проект</h3>
    <div class="field">
      <label>Путь к файлу проекта (.plcmon)</label>
      <div class="field-row-browse">
        <div class="field">
          <input type="text" id="open-project-path" placeholder="C:\Users\...\Documents\PlcMonitor\project.plcmon">
        </div>
        <button class="btn btn-ghost" onclick="browseOpenFile()" style="padding:10px 12px;flex-shrink:0;">📁</button>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" onclick="closeOpenProjectDialog()">Отмена</button>
      <button class="btn btn-primary" onclick="confirmOpenProject()">Открыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/js/index.js"></script>
</body>
</html>
